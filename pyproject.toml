[project]
name = "hcclio"
version = "0.1.0"
description = "HCCLIO: 3-tier (IoT -> Edge -> Cloud) confidence-latency collaborative inference testbed"
requires-python = ">=3.9"
dependencies = ["numpy", "msgpack", "paho-mqtt>=1.6", "pyyaml", "pillow"]

[project.optional-dependencies]
models = ["torch", "timm>=0.9"]
analysis = ["matplotlib"]
dataset = ["datasets"]
dev = ["pytest"]

[tool.setuptools]
packages = ["hcclio"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
