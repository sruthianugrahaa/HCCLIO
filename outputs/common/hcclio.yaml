# =====================================================================
# HCCLIO testbed - single shared configuration for all three tiers.
# It lives in outputs/common/, which is copied to all three machines.
# Values marked PLACEHOLDER were not given in the spec; tune them.
# =====================================================================

network:
  iot_host: mypi4.local
  # Edge = Ubuntu laptop: 10.0.17.25 on the H3C testbed L2 switch (use this for the experiments),
  # 10.0.51.158 on Wi-Fi. edge_host and mqtt.broker_host must always be the same address.
  edge_host: 10.0.17.25
  cloud_host: 10.0.51.160         # Windows laptop (Cloud tier)
  mqtt:
    broker_host: 10.0.17.25       # Mosquitto lives on the Edge laptop (same as edge_host)
    broker_port: 1883
    keepalive_s: 60
    qos: 1
    topic_prefix: hcclio
    response_timeout_s: 60
  e2lm:
    port: 9000
    edge_port: null               # optional per-tier override (loopback runs use 9001/9002)
    cloud_port: null
    timeout_s: 2.0                # an unreachable tier counts as timeout_s*1000 ms
    n_probes: 3                   # probes per measurement, the median is used
    probe_bytes: 1024
    server_work_iters: 20000      # fixed CPU work per probe so tier load shows up in the RTT

models:
  backend: timm                   # timm (real ViTs) | stub (simulated, for dry runs/tests)
  device: auto                    # auto | cpu | cuda
  torch_threads: 0                # 0 = torch default
  # augreg_in21k pretrained, fine-tuned head on ImageNet-1k so the 1000-way
  # softmax shares one label space with the dataset's ImageNet-1k indices.
  iot:   {name: vit_small_patch16_224.augreg_in21k_ft_in1k, accuracy: 0.75}
  edge:  {name: vit_base_patch16_224.augreg_in21k_ft_in1k,  accuracy: 0.80}
  cloud: {name: vit_large_patch16_224.augreg_in21k_ft_in1k, accuracy: 0.85}
  restrict_to_dataset_classes: false   # true = softmax over the 30 cobot classes only
  stub:                           # used only when backend: stub
    latency_ms: {iot: 5, edge: 3, cloud: 2}
    num_classes: 1000

gates:
  tau_conf: 0.80                  # confidence threshold (all tiers)
  tau_lat_ms: 500                 # Edge latency gate on (delta_wl + delta_E2LM_edge)

weights:                          # collaborative ensemble, each tier sums to 1
  edge:  {w_i: 0.44, w_ES: 0.56}
  cloud: {w_i: 0.28, w_ES: 0.34, w_CS: 0.38}
  # Direct IoT->Cloud path (latency gate failed) has no Edge vector; w_i and
  # w_CS are renormalised to sum to 1 (0.4242 / 0.5758) unless set here:
  cloud_direct: null

qoe:
  # Q_x = (1 - T_x^E2E / T_i^comp) * A_x ; Discard (Q=0) when T_x^E2E >= T_i^comp
  # t_i_mode: fixed      -> T_i^comp = t_i_ms
  #           calibrated -> T_i^comp = calib_scale * mean ViT-Small time on the
  #                         first calib_frames frames, measured on the IoT device
  # e2e_mode: measured -> T_x^E2E = time the IoT device waits for the answer (stopwatch on the
  #                       Pi, from frame read to answer received: local inference, E2LM probes,
  #                       MQTT transfer, queueing and remote inference) + the simulated Rayleigh
  #                       and backhaul delays (simulated, so not in the stopwatch)
  #           sum      -> T_x^E2E = sum of the logged components (no MQTT transfer or queueing)
  # Both values are logged (iot_wallclock_ms, e2e_sum_ms); e2e_latency_ms is the one used.
  e2e_mode: measured
  t_i_mode: fixed
  t_i_ms: 888                     # 2 x ViT-Small mean on the Pi 4 (444 ms, measured 2026-10-06)
  calib_frames: 20
  calib_scale: 2.0

wireless:                         # IoT <-> Edge, Rayleigh small-scale fading
  fc_hz: 3.5e+9
  bandwidth_hz: 20.0e+6
  distance_m: 10.0
  pt_dbm: 23.0
  n0_dbm_per_hz: -174.0
  noise_figure_db: 0.0            # PLACEHOLDER (spec SNR has no NF term)
  payload_bits: 1.0e+6
  rho_c: 0.5                      # PLACEHOLDER LOS-probability parameter
  d_c_m: 18.0                     # PLACEHOLDER LOS-probability distance (3GPP UMi d1)
  los_mode: sample                # sample a LOS/NLOS state per frame | expected
  min_rate_bps: 1.0               # floor to avoid divide-by-zero in deep fades

backhaul:                         # Edge <-> Cloud, Gamma(m_bh, theta_bh) in ms
  # m_bh  = floor((1 + 1.28 * MBS/MGW) * k1 + (h - 1) * k2)
  # theta = a + K_size * k3 ;  mean = m_bh * theta
  # All PLACEHOLDERS chosen for a ~19 ms mean on a campus backhaul.
  mbs_over_mgw: 4.0
  hops: 3
  k1: 1.5
  k2: 1.0
  a_ms: 0.2
  k3_ms_per_bit: 1.5e-6
  k_size_bits: 1.0e+6

dataset:
  root: ~/testbed/dataset/imagenet_1000
  manifest: manifest.csv
  n_frames: 1000
  jpeg_quality: 90
  hf_dataset: ILSVRC/imagenet-1k  # gated on Hugging Face: accept the licence + `huggingface-cli login`
  hf_split: validation

logging:
  log_dir: logs                   # relative to the outputs/ folder on each machine
  report_dir: reports
  hcclio_csv: qoe_coclio.csv

dci:                              # distributed_benchmark (Zhang et al.)
  use_ensemble: true              # true = same weighted ensembles, only the latency gate is removed

mu_sweep:
  tier: ES                        # i (mu_i) | ES (mu_ES) | CS (mu_CS); mu = service rate = 1 / (C K / f)
  mu_values: [2, 4, 6, 8, 10, 15, 20, 30, 40, 60, 80, 100]   # frames/s
  service_model: exp              # exp: inference time ~ Exp(mean 1/mu_x) | mm1 (adds queueing, needs arrival_rate) | det
  arrival_rate: 1.0               # lambda, frames/s; tier x sees P_x * lambda (P_x from the log)
  trials: 500
  seed: 2026

sim:
  seed: 2026
